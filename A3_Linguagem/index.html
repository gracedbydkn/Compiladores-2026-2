<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Analisador de gerador de formatos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
        }

        textarea {
            width: 100%;
            height: 160px;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            margin: 10px 0;
            padding: 8px 16px;
            font-size: 16px;
        }

        #saida {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 60px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>Analisador de gerador de formatos</h1>
    <textarea id="entrada"></textarea>
    <br>
    <button id="botao">Analisar</button>
    <h3>Resultado</h3>
    <div id="saida"></div>
    <script type="module" src="main.js"></script>
</body>

</html>
